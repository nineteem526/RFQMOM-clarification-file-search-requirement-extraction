# IT integration template ONLY. Not installed, not an authentication implementation.
# Replace every placeholder and use an approved SSO gateway with group restrictions.
# Start the assistant locally with:
# python project_app.py --project project-demo --port 7863 --public-origin https://REPLACE_APPROVED_HOST
# Do not use --lan-ip. Backend 7863 must not be reachable from other machines.
server {
    listen 443 ssl;
    server_name REPLACE_APPROVED_HOST;
    ssl_certificate REPLACE_CERTIFICATE_PATH;
    ssl_certificate_key REPLACE_PRIVATE_KEY_PATH;

    location = /_enterprise_auth_check {
        internal;
        proxy_pass http://127.0.0.1:REPLACE_APPROVED_AUTH_GATEWAY_PORT/REPLACE_AUTH_CHECK;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        # IT must configure the approved gateway's session cookies, login redirects,
        # authorized AD/Entra groups, and deny-by-default 401/403 behavior.
    }
    location / {
        # Protect ALL paths: UI/config/API/queue/source/preview/context/file downloads.
        # No unauthenticated static-file or health exceptions for the public endpoint.
        auth_request /_enterprise_auth_check;
        proxy_pass http://127.0.0.1:7863;
        proxy_set_header Host REPLACE_APPROVED_HOST;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
# Required acceptance by IT before enabling:
# - Unauthenticated and wrong-group users cannot access ANY protected route.
# - Correct-group users can stream queue progress and open original citations.
# - TLS trust is valid; no certificate-validation bypass.
# - Backend is loopback-only; company firewall and subnet policy remain in force.
# - API credentials remain on the host; the proxy never injects them into browsers.
# - Concurrent users share project saved results and metadata; this is NOT per-user RBAC.
